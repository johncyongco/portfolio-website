version: "3.9"

services:
  jcyongco-portfolio:
    build: .
    container_name: jcyongco-portfolio
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"

      - "traefik.http.routers.jcyongco.rule=Host(`jcyongco.pro`) || Host(`www.jcyongco.pro`)"
      - "traefik.http.routers.jcyongco.entrypoints=websecure"
      - "traefik.http.routers.jcyongco.tls=true"
      - "traefik.http.routers.jcyongco.tls.certresolver=letsencrypt"

      - "traefik.http.services.jcyongco.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
